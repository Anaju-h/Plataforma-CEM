quarkus.datasource.db-kind=mssql
quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.http.host=0.0.0.0
quarkus.http.proxy.proxy-address-forwarding=true

# ---------------------------------------------------------------
# Autenticação (DS-059): JWT via SmallRye JWT, entregue somente em cookie HttpOnly/SameSite=Strict.
# As chaves em resources/jwt são exclusivas de DEV/demonstração. Em produção, informe
# LAB_JWT_PUBLIC_KEY / LAB_JWT_PRIVATE_KEY (caminhos) e LAB_COOKIE_SECURE=true atrás do TLS do NGINX/Ingress.
# ---------------------------------------------------------------
mp.jwt.verify.issuer=lab-platform
mp.jwt.verify.publickey.location=${LAB_JWT_PUBLIC_KEY:jwt/publicKey.pem}
smallrye.jwt.sign.key.location=${LAB_JWT_PRIVATE_KEY:jwt/privateKey.pem}
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=lab_session
lab.auth.cookie-secure=${LAB_COOKIE_SECURE:false}
lab.auth.session-hours=8
quarkus.http.auth.proactive=false

# Público: formulário do site, login/cadastro. A área do cliente valida o próprio cookie (AuthenticatedCustomerContext).
quarkus.http.auth.permission.public.paths=/api/auth/*,/api/public/*,/api/customer/*,/q/*
quarkus.http.auth.permission.public.policy=permit
# Área interna: leitura para qualquer perfil; escrita a partir de Técnico. Regras finas ficam nos serviços.
quarkus.http.auth.policy.staff.roles-allowed=CONSULTA,TECNICO,VALIDADOR,ADMIN
quarkus.http.auth.policy.editors.roles-allowed=TECNICO,VALIDADOR,ADMIN
quarkus.http.auth.permission.internal-read.paths=/api/*
quarkus.http.auth.permission.internal-read.methods=GET,HEAD,OPTIONS
quarkus.http.auth.permission.internal-read.policy=staff
quarkus.http.auth.permission.internal-write.paths=/api/*
quarkus.http.auth.permission.internal-write.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.internal-write.policy=editors

# Operação comercial (SOL, ORC, propostas), usuários, dados de demonstração e quadro de tarefas: somente Administrador.
# Técnico/Validador/Consulta acessam apenas os projetos delegados (filtrados no serviço), Meu trabalho e o Conhecimento.
quarkus.http.auth.policy.admins.roles-allowed=ADMIN
quarkus.http.auth.permission.admin-only.paths=/api/requests,/api/requests/*,/api/quotes,/api/quotes/*,/api/admin/*,/api/work/board
quarkus.http.auth.permission.admin-only.policy=admins
%test.quarkus.http.auth.permission.admin-only.policy=permit

# Regra do módulo de conhecimento: PRJ só conclui com Registro de Serviço (blocos B e C) fechado.
lab.knowledge.require-record-on-project-completion=true

# Testes de integração existentes exercitam as APIs internas diretamente.
%test.quarkus.http.auth.permission.internal-read.policy=permit
%test.quarkus.http.auth.permission.internal-write.policy=permit
%test.lab.knowledge.require-record-on-project-completion=false

# Consulta pode usar o Assistente, ler avisos e assinar assuntos (ações pessoais/de leitura via POST/PUT).
quarkus.http.auth.permission.knowledge-personal.paths=/api/knowledge/assistant,/api/knowledge/notices/*,/api/knowledge/subscriptions
quarkus.http.auth.permission.knowledge-personal.policy=staff
%test.quarkus.http.auth.permission.knowledge-personal.policy=permit
