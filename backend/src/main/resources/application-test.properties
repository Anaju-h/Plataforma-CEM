quarkus.datasource.db-kind=mssql
quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=lab_platform_test;encrypt=true;trustServerCertificate=true
quarkus.datasource.username=${TEST_DB_USER:${DB_USER}}
quarkus.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
